<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oncolife Care × Hospital Parceiro — Demo do Hub de Interoperabilidade</title>
<style>
  :root{
    --dark:#18362B; --dark2:#0f2a20; --mint:#00B98E; --mintDim:#0f7f65;
    --ink:#101828; --muted:#475467; --soft:#667085; --line:#d8e0ea;
    --bg:#f4f6fb; --white:#ffffff; --light:#E8F5F1; --amber:#B54708;
    --warnBg:#FFFAEB; --blue:#1570EF; --blueBg:#EFF8FF; --thBg:#f8fafc;
    --softTop:#f3fbf8; --danger:#D92D20; --dangerBg:#FEF3F2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-weight:750;letter-spacing:-0.01em;margin:0;}
  a{color:inherit;}
  code,.mono{font-family:"SFMono-Regular",ui-monospace,Consolas,monospace;}
  .tabular{font-variant-numeric:tabular-nums;}

  .watermark{position:sticky;top:0;z-index:70;background:var(--warnBg);color:var(--amber);
    font-size:.68rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em;
    text-align:center;padding:.45rem .75rem;border-bottom:1px solid #fde8b8;}

  header.topnav{position:sticky;top:28px;z-index:60;background:rgba(255,255,255,.97);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .topnav-inner{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;
    align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{font-weight:800;color:var(--dark);font-size:15px;letter-spacing:-.02em;
    text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;
    padding:0;flex-shrink:0;}
  .brand span{color:var(--mintDim);}
  .ato-nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
  .ato-btn{display:flex;align-items:center;gap:6px;border:none;background:transparent;
    cursor:pointer;padding:6px 10px;border-radius:8px;font-family:inherit;color:var(--soft);
    font-size:12.5px;font-weight:600;}
  .ato-btn.active{color:var(--dark);background:var(--light);}
  .ato-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:10px;font-weight:700;background:#fff;color:var(--soft);
    border:1px solid var(--line);flex-shrink:0;}
  .ato-btn.active .ato-dot{background:var(--mint);color:#fff;border:none;}
  .pres-btn{font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px;
    border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;flex-shrink:0;}
  .pres-btn:hover{border-color:var(--mint);}

  main{max-width:1200px;margin:0 auto;padding:32px 20px 100px;}

  .kicker{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
    color:var(--amber);background:var(--warnBg);display:inline-block;padding:3px 9px;
    border-radius:6px;margin-bottom:10px;}
  h1.title{font-size:22px;font-weight:800;color:var(--dark);margin:0 0 6px;letter-spacing:-.01em;}
  p.sub{color:var(--muted);font-size:13.5px;max-width:640px;margin:0 0 26px;line-height:1.55;}

  .tag{font-size:.65rem;font-weight:750;text-transform:uppercase;letter-spacing:.05em;
    color:var(--mintDim);background:var(--light);border-radius:6px;padding:.22rem .5rem;
    display:inline-block;white-space:nowrap;}
  .tag.amber{color:var(--amber);background:var(--warnBg);}
  .tag.blue{color:var(--blue);background:var(--blueBg);}
  .tag.danger{color:var(--danger);background:var(--dangerBg);}
  .tag.dark{color:#fff;background:var(--dark);}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;
    box-shadow:0 1px 2px rgb(16 24 40/4%);}
  .card h2{font-size:15px;color:var(--dark);margin:0 0 4px;}

  .btn-primary{background:var(--mint);color:#fff;border:none;font-weight:700;font-size:13.5px;
    padding:11px 20px;border-radius:10px;cursor:pointer;font-family:inherit;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:700;
    font-size:13px;padding:9px 16px;border-radius:10px;cursor:pointer;font-family:inherit;}
  .btn-secondary:hover{border-color:var(--ink);}
  .btn-danger{background:var(--danger);color:#fff;border:none;font-weight:700;font-size:13.5px;
    padding:11px 20px;border-radius:10px;cursor:pointer;font-family:inherit;}
  .btn-mint-outline{background:var(--light);color:var(--mintDim);border:none;font-weight:700;
    font-size:12px;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;}

  .actions-row{display:flex;justify-content:flex-end;gap:10px;margin-top:26px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{background:var(--thBg);color:var(--soft);border-bottom:1px solid var(--line);text-align:left;
    padding:8px 10px;font-weight:700;}
  td{padding:7px 10px;border-bottom:1px solid var(--line);}

  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}

  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--soft);margin-bottom:6px;}
  .kpi .val{font-size:23px;font-weight:800;color:var(--ink);}
  .kpi .val.amber{color:var(--amber);}
  .kpi .val.mint{color:var(--mintDim);}

  .hero{background:radial-gradient(ellipse 60% 50% at 85% 10%, rgba(0,185,142,.22), transparent 55%),
      linear-gradient(155deg, var(--dark) 0%, #1a4a38 50%, var(--dark2) 100%);
    color:#fff;padding:64px 20px 76px;text-align:center;}
  .hero h1{font-size:34px;font-weight:800;margin:0 0 16px;max-width:760px;margin-left:auto;margin-right:auto;line-height:1.2;}
  .hero p{color:rgba(255,255,255,.75);font-size:15.5px;max-width:640px;margin:0 auto 30px;line-height:1.6;}
  .chip{border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
    color:#fff;display:inline-block;padding:5px 12px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.08em;}
  .hero-cta{display:inline-flex;align-items:center;gap:8px;background:var(--mint);color:#fff;
    font-weight:800;padding:13px 26px;border-radius:12px;text-decoration:none;font-size:14.5px;
    border:none;cursor:pointer;font-family:inherit;}
  kbd.chip{padding:3px 7px;font-size:10.5px;}

  /* console skins */
  .console-shell{border-radius:14px;overflow:hidden;}
  .console-header{padding:10px 16px;font-size:10.5px;font-weight:800;text-transform:uppercase;
    letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .console-body{padding:18px;}
  .console-shell.tasy{background:#eef1f5;border:1px solid #c7d0dc;border-radius:4px;}
  .console-shell.tasy .console-header{background:#3c4757;color:#e7ebf0;}
  .console-shell.salesforce{background:var(--blueBg);border:1px solid #bcdcff;}
  .console-shell.salesforce .console-header{background:var(--blue);color:#fff;}
  .console-shell.healthlake{background:var(--dark2);border:1px solid #2c4a3c;}
  .console-shell.healthlake .console-header{background:rgba(0,0,0,.2);color:var(--mint);}
  .console-shell.tiss{background:#f5f3ff;border:1px solid #ddd6fe;}
  .console-shell.tiss .console-header{background:#5b21b6;color:#ede9fe;}

  /* payer flow diagram */
  .flow-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;flex:1;min-width:180px;}
  .flow-arrow{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--soft);padding:0 6px;}
  .search-input{width:100%;max-width:420px;padding:9px 12px;font-size:13.5px;font-family:inherit;
    border-radius:8px;outline:none;}
  .missing-bar{padding:12px 16px;font-size:12px;border-top:1px solid rgba(0,0,0,.08);}
  .cmp-toggle-wrap{margin-top:14px;}
  .empty-note{padding:26px 0;text-align:center;font-size:13px;}

  .cmp-table td, .cmp-table th{font-size:12px;}
  .cmp-row-divergent{background:var(--warnBg);}

  /* pipeline */
  .pipeline-row{display:flex;align-items:center;justify-content:space-between;gap:6px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 16px;
    margin-bottom:22px;overflow-x:auto;}
  .pipe-step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:88px;}
  .pipe-step .circle{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--soft);background:#fff;
    font-size:12.5px;font-weight:700;transition:.25s;}
  .pipe-step .lbl{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--soft);
    text-transform:uppercase;text-align:center;}
  .pipe-step.active .circle{border-color:var(--mint);color:var(--mint);box-shadow:0 0 0 4px rgba(0,185,142,.14);}
  .pipe-step.done .circle{border-color:var(--mint);background:var(--mint);color:#fff;}
  .pipe-step.done .lbl{color:var(--ink);}

  .term{border-radius:14px;background:var(--dark2);border:1px solid #2c4a3c;padding:14px;
    height:400px;overflow-y:auto;}
  .term-line{font-family:"SFMono-Regular",ui-monospace,Consolas,monospace;font-size:12px;
    line-height:1.7;}
  .cursor-blink{display:inline-block;width:7px;height:13px;background:var(--mint);
    animation:blink 1s step-start infinite;vertical-align:middle;}
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}

  /* json */
  .json{font-family:"SFMono-Regular",ui-monospace,Consolas,monospace;font-size:12.3px;
    line-height:1.55;white-space:pre-wrap;word-break:break-word;}
  .jk{color:#ffa657;} .js2{color:#7ee787;} .jn{color:#79c0ff;} .jb{color:#ff7b72;} .jnull{color:#8b949e;}

  /* provenance badge + drawer */
  .prov-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    border-radius:999px;padding:2px 9px;border:1px solid;cursor:pointer;font-family:inherit;background:#fff;}
  .prov-dot{width:6px;height:6px;border-radius:50%;}
  #drawerOverlay{position:fixed;inset:0;z-index:200;display:none;}
  #drawerOverlay.open{display:flex;justify-content:flex-end;}
  .drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3);}
  .drawer-panel{position:relative;width:100%;max-width:420px;height:100%;background:#fff;
    box-shadow:-8px 0 24px rgba(0,0,0,.12);padding:26px;overflow-y:auto;}

  /* timeline */
  .tl-item{display:flex;gap:14px;position:relative;padding-bottom:22px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-rail{display:flex;flex-direction:column;align-items:center;}
  .tl-dot{width:10px;height:10px;border-radius:50%;background:var(--mint);flex-shrink:0;margin-top:5px;}
  .tl-line{width:1px;flex:1;background:var(--line);margin-top:2px;}

  /* sliders */
  input[type=range]{width:100%;accent-color:var(--mint);}
  input[type=range].amber{accent-color:var(--amber);}

  /* bars */
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .bl{flex:0 0 140px;font-size:11.5px;color:var(--muted);text-align:right;}
  .bar-track{flex:1;height:16px;border-radius:5px;background:var(--thBg);overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;transition:width .8s ease;}
  .bar-val{flex:0 0 42px;font-size:11.5px;font-weight:800;color:var(--ink);}

  /* presentation footer */
  #presBar{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--dark);color:#fff;
    padding:12px 22px;display:none;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;font-size:13px;box-shadow:0 -4px 16px rgba(0,0,0,.15);}
  #presBar.show{display:flex;}

  .fadein{animation:fadein .3s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  select,input[type=text]{font-family:inherit;}

  /* ---- painel executivo (Ato 6) — mockup do produto real ---- */
  .oc-shell{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 32px rgba(16,24,40,.08);
    display:flex;background:#fff;}
  .oc-sidebar{width:190px;flex-shrink:0;background:var(--dark);color:#fff;padding:18px 14px;display:flex;flex-direction:column;}
  .oc-sidebar-logo{display:flex;align-items:center;gap:8px;padding:0 4px 18px;font-weight:800;font-size:14px;}
  .oc-sidebar-logo svg{flex-shrink:0;}
  .oc-nav-section{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:rgba(255,255,255,.4);
    text-transform:uppercase;margin:14px 0 6px;padding:0 8px;}
  .oc-nav-item{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.72);
    padding:7px 8px;border-radius:8px;cursor:default;}
  .oc-nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;}
  .oc-nav-item.active{background:rgba(255,255,255,.12);color:#fff;}
  .oc-nav-item.active .dot{background:var(--mint);opacity:1;}
  .oc-sidebar-user{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px 8px 2px;
    border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;}
  .oc-avatar{width:26px;height:26px;border-radius:50%;background:var(--mint);color:var(--dark);font-weight:800;
    font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .oc-main{flex:1;min-width:0;background:var(--bg);}
  .oc-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);}
  .oc-topbar-pill{font-size:11px;font-weight:600;color:var(--soft);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;background:#fff;white-space:nowrap;}
  .oc-body{padding:18px;}
  .oc-kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px;}
  .oc-kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;}
  .oc-kpi .lbl{font-size:10.5px;color:var(--soft);font-weight:600;margin-bottom:6px;}
  .oc-kpi .val{font-size:19px;font-weight:800;color:var(--ink);}
  .oc-kpi .delta{font-size:10.5px;font-weight:700;margin-top:3px;}
  .oc-kpi .delta.up{color:var(--mintDim);} .oc-kpi .delta.down{color:var(--danger);}
  .oc-row2{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:12px;}
  .oc-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
  .oc-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .oc-card h4{font-size:12.5px;font-weight:750;color:var(--ink);margin:0 0 10px;}
  .oc-legend{display:flex;flex-direction:column;gap:6px;font-size:11px;}
  .oc-legend .row{display:flex;align-items:center;gap:7px;color:var(--muted);}
  .oc-legend .sw{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .oc-legend .row b{color:var(--ink);margin-left:auto;}
  .oc-ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .oc-ring-label{font-size:10.5px;color:var(--soft);font-weight:600;text-align:center;}
  .oc-opgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .oc-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;
    padding:10px 18px;font-size:10.5px;color:var(--soft);border-top:1px solid var(--line);background:#fff;}
</style>
</head>

  <div id="presBar"></div>
  <div id="drawerOverlay"><div class="drawer-backdrop" onclick="closeDrawer()"></div><div class="drawer-panel" id="drawerPanel"></div></div>

/* ---- gerador determinístico (mulberry32) ---- */
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)];}
function range(rng,min,max){return Math.floor(min+rng()*(max-min+1));}
function weightedPick(rng,items,weights){const r=rng();let acc=0;for(let i=0;i<items.length;i++){acc+=weights[i];if(r<=acc)return items[i];}return items[items.length-1];}

let currentIndex=0;
function goTo(id){const idx=SEQUENCE.findIndex(s=>s.id===id);currentIndex=idx>=0?idx:0;location.hash=SEQUENCE[currentIndex].id;render();window.scrollTo({top:0,behavior:"instant"});}
window.addEventListener("hashchange",()=>{const id=(location.hash||"#home").slice(1);const idx=SEQUENCE.findIndex(s=>s.id===id);currentIndex=idx>=0?idx:0;render();});

document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape"){const ov=document.getElementById("drawerOverlay"); if(ov&&ov.classList.contains("open")){closeDrawer();e.preventDefault();return;}}
  const tag=(e.target&&e.target.tagName)||""; if(["INPUT","TEXTAREA","SELECT"].includes(tag)) return;
  const drawerOpen=document.getElementById("drawerOverlay")&&document.getElementById("drawerOverlay").classList.contains("open");
  if(drawerOpen) return;
  if(e.key==="ArrowRight"){currentIndex=Math.min(currentIndex+1,SEQUENCE.length-1);goTo(SEQUENCE[currentIndex].id);e.preventDefault();}
  else if(e.key==="ArrowLeft"){currentIndex=Math.max(currentIndex-1,0);goTo(SEQUENCE[currentIndex].id);e.preventDefault();}
  else if(e.key.toLowerCase()==="p"){togglePresentation();}
  else if(e.key.toLowerCase()==="r"){resetAll();}
});

function togglePresentation(){
  const on=!STATE.presentationMode;
  setState({presentationMode:on,presentationStartedAt:on?Date.now():null});
  render();
}
let presTimer=null;
function renderPresBar(){
  const bar=document.getElementById("presBar");
  if(!STATE.presentationMode){bar.classList.remove("show");bar.innerHTML="";if(presTimer)clearInterval(presTimer);return;}
  bar.classList.add("show");
  const ato=ATOS.find(a=>a.n===SEQUENCE[currentIndex].ato);
  function paint(){
    const elapsed=Math.floor((Date.now()-(STATE.presentationStartedAt||Date.now()))/1000);
    const mm=String(Math.floor(elapsed/60)).padStart(2,"0"), ss=String(elapsed%60).padStart(2,"0");
    bar.innerHTML=`<div><span class="tag dark">Ato ${ato.n} · alvo ${ato.min} min</span> <span style="opacity:.8;margin-left:8px;">${ato.obj}</span></div>
      <div style="display:flex;align-items:center;gap:16px;" class="tabular"><span>${mm}:${ss}</span><span style="opacity:.6;">P para sair · ← → navega · R reseta</span></div>`;
  }
  paint(); if(presTimer)clearInterval(presTimer); presTimer=setInterval(paint,1000);
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function jsonView(data){
  const json=esc(JSON.stringify(data,null,2));
  const highlighted=json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,(m)=>{
    let cls="jn"; if(/^"/.test(m)){cls=/:$/.test(m)?"js2":"jk";} else if(/true|false/.test(m)){cls="jb";} else if(/null/.test(m)){cls="jnull";}
    return `<span class="${cls}">${m}</span>`;
  });
  return `<pre class="json">${highlighted}</pre>`;
}
let PROV_REG=[];
function provBadge(tag){
  const SRC_COLOR={tasy:"#667085",salesforce:"#1570EF",healthlake:"#18362B",oncolife:"#00B98E"};
  const idx=PROV_REG.length; PROV_REG.push(tag);
  const c=SRC_COLOR[tag.source]||"#667085";
  return `<button class="prov-badge" style="border-color:${c}55;color:${c};background:${c}12" onclick="openDrawer(${idx})"><span class="prov-dot" style="background:${c}"></span>${esc(tag.label)}</button>`;
}
function openDrawer(idx){
  const tag=PROV_REG[idx]; if(!tag) return;
  const SRC_LABEL={tasy:"Tasy",salesforce:"Salesforce",healthlake:"HealthLake",oncolife:"Oncolife Care"};
  document.getElementById("drawerPanel").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <span class="tag">${SRC_LABEL[tag.source]}</span>
      <button onclick="closeDrawer()" style="background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--soft);">×</button>
    </div>
    <h3 style="font-size:16px;color:var(--dark);margin-bottom:4px;">Proveniência do campo</h3>
    <p style="font-size:12.5px;color:var(--soft);margin-bottom:20px;">${esc(tag.label)}</p>
    <div style="margin-bottom:16px;">
      <div style="font-size:11px;text-transform:uppercase;color:var(--soft);margin-bottom:4px;">Campo bruto na origem</div>
      <div style="border:1px solid var(--line);background:var(--thBg);border-radius:8px;padding:9px 12px;font-size:12.5px;font-family:monospace;word-break:break-word;">${esc(tag.rawField)}</div>
      <div style="font-size:11px;color:var(--soft);margin-top:4px;">Caminho: ${esc(tag.rawPath)}</div>
    </div>
    <div style="font-size:12px;font-weight:700;color:var(--mintDim);margin:12px 0;">↓ normalizado para</div>
    <div>
      <div style="font-size:11px;text-transform:uppercase;color:var(--soft);margin-bottom:4px;">Caminho FHIR de destino</div>
      <div style="border:1px solid var(--line);background:var(--light);border-radius:8px;padding:9px 12px;font-size:12.5px;font-family:monospace;color:var(--mintDim);word-break:break-word;">${esc(tag.fhirPath)}</div>
    </div>`;
  document.getElementById("drawerOverlay").classList.add("open");
}
function closeDrawer(){document.getElementById("drawerOverlay").classList.remove("open");}

function kpi(label,val,tone){return `<div class="kpi"><div class="lbl">${esc(label)}</div><div class="val ${tone||""}">${esc(val)}</div></div>`;}
function barList(title,rows,color){
  const max=Math.max.apply(null,rows.map(r=>r.value));
  return `<div class="card"><h2>${esc(title)}</h2><div style="margin-top:14px;">${rows.map(r=>`
    <div class="bar-row"><div class="bl">${esc(r.label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${(r.value/max*100)}%;background:${color}"></div></div>
    <div class="bar-val">${r.value}${r.suffix||""}</div></div>`).join("")}</div></div>`;
}
function fmtDateBR(iso){const d=new Date(iso+"T12:00:00");return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","");}
function fmtFullDateBR(d){return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});}
function addDays(baseIso,days){const d=new Date(baseIso+"T00:00:00");d.setDate(d.getDate()+days);return d;}

/* ---- ATO 2: sync ---- */
const STEP_PROGRESS=[{line:0,key:"tasy",pct:35},{line:1,key:"tasy",pct:100},{line:2,key:"salesforce",pct:100},{line:3,key:"healthlake",pct:100},
  {line:4,key:"mpi",pct:35},{line:5,key:"mpi",pct:70},{line:6,key:"mpi",pct:100},{line:7,key:"normalize",pct:100},{line:8,key:"validate",pct:100},{line:9,key:"load",pct:100}];
const SYNC_STEPS=["tasy","salesforce","healthlake","mpi","normalize","validate","load"];
const SYNC_LABEL={tasy:"Tasy",salesforce:"Salesforce",healthlake:"HealthLake",mpi:"MPI",normalize:"Normalize",validate:"Validate",load:"Load"};
let syncProgress=Object.fromEntries(SYNC_STEPS.map(k=>[k,0]));
let syncRevealed=0, syncRunning=false, syncTimeouts=[];

function screenSync(){
  const finished = syncRevealed===SYNC_LOG.length && !syncRunning;
  return `
  <div class="kicker">Ato 2 · Motor de sincronização</div>
  <h1 class="title">Transformando três verdades parciais em uma</h1>
  <p class="sub">Ingestão → resolução de identidade (MPI) → normalização FHIR/mCODE → validação → carga no tenant. Nada instantâneo — cada lote simula latência real de conector.</p>
  <p style="font-size:11.5px;color:var(--amber);font-weight:700;margin:-10px 0 18px;">⚠ Esta simulação comprime em segundos um programa que, no mundo real, é construído em conjunto com o hospital ao longo de 6 meses — <a href="#setup" onclick="goTo('setup')" style="text-decoration:underline;color:var(--amber);">veja como →</a></p>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px;">
    <button class="btn-primary" ${syncRunning?"disabled":""} onclick="runSync()">${syncRunning?"Sincronizando…":(syncRevealed>0?"Rodar sincronização novamente":"Rodar sincronização")}</button>
    ${STATE.syncRunId>0?`<span style="font-size:12px;color:var(--soft);">execução #${STATE.syncRunId}</span>`:""}
  </div>
  <div class="grid grid-2">
    <div>
      <div class="grid grid-4" style="margin-bottom:18px;">
        ${SYNC_STEPS.map(k=>`<div class="card" style="padding:12px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--soft);">${SYNC_LABEL[k]}</span>
          <span class="tabular" style="font-size:10.5px;font-weight:800;color:${syncProgress[k]===100?"var(--mintDim)":"var(--soft)"}">${syncProgress[k]}%</span></div>
          <div style="height:5px;border-radius:99px;background:var(--line);overflow:hidden;"><div style="height:100%;border-radius:99px;background:var(--mint);width:${syncProgress[k]}%;transition:width .5s;"></div></div>
        </div>`).join("")}
      </div>
      ${finished?`<div class="card fadein" style="border-color:var(--mint);">
        <span class="tag">sincronização concluída</span>
        <div style="font-size:18px;font-weight:800;color:var(--dark);margin:10px 0 6px;">1 paciente, 3 fontes, 1 verdade</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">${HUB_METRICS.tenantPatientCount.toLocaleString("pt-BR")} pacientes carregados no tenant hospital-parceiro · taxa de match automático ${HUB_METRICS.mpiMatchRatePct}% · latência média ${HUB_METRICS.avgSyncLatencyMs}ms.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-mint-outline" onclick="goTo('mpi')">Ver fila de conflitos do MPI →</button>
          <button class="btn-mint-outline" onclick="goTo('paciente')">Ver Golden Record da Maria →</button>
          <button class="btn-secondary" onclick="goTo('setup')">Ver como isso é construído de verdade →</button>
        </div>
      </div>`:""}
    </div>
    <div class="term" id="termBox">
      <div style="font-size:11px;color:rgba(255,255,255,.4);margin-bottom:8px;" class="mono">$ oncolife-hub sync --tenant hospital-parceiro</div>
      <div id="termLines"></div>
    </div>
  </div>`;
}
function paintTermLines(){
  const box=document.getElementById("termLines"); if(!box) return;
  let html="";
  for(let i=0;i<syncRevealed;i++){const l=SYNC_LOG[i];html+=`<div class="term-line fadein" style="color:${TONE_COLOR[l.tone]}"><span style="color:rgba(255,255,255,.35)">[${l.t}]</span> ${esc(l.text)}</div>`;}
  if(syncRunning) html+=`<span class="cursor-blink"></span>`;
  if(syncRevealed===0 && !syncRunning) html=`<div style="color:rgba(255,255,255,.3);font-size:12px;" class="mono">Aguardando execução…</div>`;
  box.innerHTML=html;
  const term=document.getElementById("termBox"); if(term) term.scrollTop=term.scrollHeight;
}
function runSync(){
  syncTimeouts.forEach(clearTimeout); syncTimeouts=[];
  syncRevealed=0; syncProgress=Object.fromEntries(SYNC_STEPS.map(k=>[k,0])); syncRunning=true;
  setState({syncRunId:STATE.syncRunId+1,syncHasRun:true});
  renderScreen();
  let acc=300;
  SYNC_LOG.forEach((line,i)=>{
    acc+=line.delay;
    const to=setTimeout(()=>{
      syncRevealed=Math.max(syncRevealed,i+1);
      const step=STEP_PROGRESS.find(s=>s.line===i); if(step) syncProgress[step.key]=step.pct;
      if(i===SYNC_LOG.length-1){syncRunning=false;renderScreen();} else {
        // update progress bars + terminal without full re-render (keeps state fluid)
        document.querySelectorAll(".card .tabular").forEach(()=>{});
        renderScreen();
      }
    },acc);
    syncTimeouts.push(to);
  });
}

function apiRunQuery(ex,scope){
  if(ex.method==="POST"&&scope==="leitura") return {status:403,statusText:"Forbidden",body:{resourceType:"OperationOutcome",issue:[{severity:"error",code:"forbidden",diagnostics:"Token com escopo somente leitura — POST negado."}]}};

  return {status:200,statusText:"OK",body:apiBuildResponse(ex.id)};
}
function apiCurl(ex,scope){const token=scope==="leitura"?"demo_read_only_token":"demo_read_write_token";const base="https://hub-demo.oncolife.care/fhir";
  if(ex.method==="GET") return `curl -H "Authorization: Bearer ${token}" \\\n  "${base}${ex.path}"`;
  return `curl -X POST -H "Authorization: Bearer ${token}" -H "Content-Type: application/fhir+json" \\\n  -d '{"resourceType":"Observation"}' \\\n  "${base}${ex.path}"`;
}

function ringSVG(pct,color,size,strokeW){
  size=size||64; strokeW=strokeW||7;
  const r=(size-strokeW)/2,c=size/2,circ=2*Math.PI*r,off=circ*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);transform-origin:50% 50%;">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--thBg)" stroke-width="${strokeW}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeW}" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
  </svg>`;
}
function donutSVG(items,size){
  size=size||140; const strokeW=size*0.17,r=(size-strokeW)/2,c=size/2,circ=2*Math.PI*r; let acc=0;
  const segs=items.map(it=>{
    const segLen=circ*(it.value/100); const dashoffset=-acc; acc+=segLen;
    return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${strokeW}"
      stroke-dasharray="${segLen} ${circ-segLen}" stroke-dashoffset="${dashoffset}"/>`;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);transform-origin:50% 50%;">${segs}</svg>`;
}
function areaChartSVG(vals,w,h){
  w=w||520; h=h||150; const pad=8;
  const max=Math.max.apply(null,vals),min=Math.min.apply(null,vals),range=(max-min)||1;
  const stepX=(w-pad*2)/(vals.length-1);
  const pts=vals.map((v,i)=>[pad+i*stepX,pad+(1-(v-min)/range)*(h-pad*2)]);
  const line=pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=line+` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const last=pts[pts.length-1];
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible;display:block;">
    <defs><linearGradient id="ocAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00B98E" stop-opacity=".35"/><stop offset="100%" stop-color="#00B98E" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#ocAreaGrad)"/>
    <path d="${line}" fill="none" stroke="var(--mint)" stroke-width="2.5"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--mint)" stroke="#fff" stroke-width="2"/>
  </svg>`;
}
function survivalChartSVG(series,w,h){
  w=w||360; h=h||160; const pad=10;
  const stepX=(w-pad*2)/(series[0].vals.length-1);
  const toY=v=>pad+(1-v/100)*(h-pad*2);
  const grid=[0,25,50,75,100].map(v=>`<line x1="${pad}" y1="${toY(v).toFixed(1)}" x2="${w-pad}" y2="${toY(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`).join("");
  const paths=series.map(s=>{
    const line=s.vals.map((v,i)=>(i===0?"M":"L")+(pad+i*stepX).toFixed(1)+","+toY(v).toFixed(1)).join(" ");
    return `<path d="${line}" fill="none" stroke="${s.color}" stroke-width="2.25"/>`;
  }).join("");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;">${grid}${paths}</svg>`;
}

/* ---- ATO 6: prazos ---- */
function screenPrazos(){
  let cumulative=0;
  const rows=PROGRAM_GATES.map(g=>{const offset=STATE.gateOffsets[g.key]||0;cumulative+=offset;const adjustedDay=g.baselineDay+cumulative;
    return Object.assign({},g,{offset,adjustedDay,date:addDays(PROGRAM_START,adjustedDay),baselineDate:addDays(PROGRAM_START,g.baselineDay)});});
  const totalDelay=rows.reduce((a,r)=>a+r.offset,0); const finalGate=rows[rows.length-1]; const delayed=rows.filter(r=>r.offset>0);
  return `
  <div class="kicker">Ato 6 · Prazos</div>
  <h1 class="title">Simulador de gates do programa</h1>
  <p class="sub">Programa de 6 meses, início ${fmtFullDateBR(new Date(PROGRAM_START+"T00:00:00"))}. Arraste qualquer gate para ver o impacto em cascata na data de entrega.</p>
  <div class="card" style="margin-bottom:22px;${totalDelay>0?"border-color:var(--amber);background:var(--warnBg);":"border-color:var(--mint);"}">
    ${totalDelay===0?`<p style="font-size:14px;font-weight:700;">Nenhum atraso — entrega prevista em 6 meses, <b>${fmtFullDateBR(finalGate.date)}</b>.</p>`
      :`<p style="font-size:14px;font-weight:700;">${delayed.map(g=>`${g.label} atrasado ${g.offset} dia${g.offset>1?"s":""}`).join(" + ")} → entrega 6 meses + ${totalDelay} dia${totalDelay>1?"s":""} <span style="color:var(--amber);">(${fmtFullDateBR(finalGate.date)})</span></p>`}
  </div>
  <div style="display:flex;flex-direction:column;gap:14px;">
    ${rows.map(g=>`<div class="card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-bottom:8px;">
        <div><b style="font-size:14px;">${g.label}</b> <span style="font-size:12px;color:var(--soft);">baseline D+${g.baselineDay} · ${fmtFullDateBR(g.baselineDate)}</span></div>
        <span class="tag ${g.offset>0?"amber":""}">${g.offset>0?"+"+g.offset+"d → ":""}${fmtFullDateBR(g.date)}</span>
      </div>
      <input type="range" class="amber" min="0" max="60" value="${g.offset}" oninput="setGateOffset('${g.key}',Number(this.value))">
    </div>`).join("")}
  </div>
  <button class="btn-primary" style="margin-top:22px;background:var(--dark);" onclick="exportScenario()">Exportar cenário</button>
  `;
}
function setGateOffset(key,val){STATE.gateOffsets[key]=val;saveState();renderScreen();}
function exportScenario(){
  let cumulative=0; const gates=PROGRAM_GATES.map(g=>{const offset=STATE.gateOffsets[g.key]||0;cumulative+=offset;const adjustedDay=g.baselineDay+cumulative;
    return {gate:g.label,baselineDay:g.baselineDay,offsetDays:offset,adjustedDate:addDays(PROGRAM_START,adjustedDay).toISOString().slice(0,10)};});
  const totalDelayDays=Object.values(STATE.gateOffsets).reduce((a,b)=>a+b,0);
  const scenario={programStart:PROGRAM_START,gates,totalDelayDays,newDeliveryDate:gates[gates.length-1].adjustedDate};
  const blob=new Blob([JSON.stringify(scenario,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="cenario-prazos-oncolife.json"; a.click(); URL.revokeObjectURL(url);
}

function renderScreen(){
  const id=SEQUENCE[currentIndex].id;
  document.getElementById("app").innerHTML = `<div class="fadein">${SCREENS[id]()}</div>`;
  if(id==="sync") paintTermLines();
}
function render(){renderTopNav();renderScreen();renderPresBar();}

/* init */
(function init(){
  const id=(location.hash||"").slice(1);
  const idx=SEQUENCE.findIndex(s=>s.id===id);
  currentIndex = idx>=0?idx:0;
  if(!location.hash) location.hash=SEQUENCE[0].id;

})();
